name:                haskell
version:             0.1.0.0
github:              "githubuser/haskell"
license:             BSD-3-Clause
author:              "Author name here"
maintainer:          "example@example.com"
copyright:           "2025 Author name here"

extra-source-files:
- README.md
- CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/githubuser/haskell#readme>

dependencies:
- base >= 4.7 && < 5

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

# library:
#   source-dirs: session3
#   dependencies:
#   - hasktorch
#   - hasktorch-tools

executables:
  session3-linear-regression:
    main: LinearRegression.hs
    source-dirs: session3/linearRegression
    dependencies:
    - hasktorch
    - hasktorch-tools
    - nlp-tools

  session3-graduate-admission-linear:
    main: GraduateAdmissionLinear.hs
    source-dirs: session3/graduateAdmissionLinear
    dependencies:
    - hasktorch
    - hasktorch-tools
    - nlp-tools
    - bytestring
    - vector
    - cassava

tests:
  haskell-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - hasktorch
    - hasktorch-tools
